<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131211">
<title>Klickern</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131211'/%3E%3Cpath d='M16 6v20M8 14l8-8 8 8' fill='none' stroke='%23f08a5d' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  Klickerns telefonsida (30 oktober 2026). Samma clicker som presentatörsvyn i telefonen: framåt är
  en stor knapp under tummen, bakåt är liten och går att gömma. Hörlurarnas knappar styr genom
  Media Session medan sidan spelar en tyst slinga. Allt i en fil, utan beroenden.
-->
<style>
  :root {
    --bg: #131211; --yta: #1c1a18; --text: #efe9e1; --muted: #9a938a; --linje: #34302c;
    --accent: #f08a5d; --accent-yta: rgba(240, 138, 93, 0.14); --accent-tryck: rgba(240, 138, 93, 0.34);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  main {
    height: 100dvh; display: flex; flex-direction: column; gap: 14px;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .namn { min-width: 0; }
  #titel { margin: 0; font-size: 1.05rem; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
  #anslutning { margin: 2px 0 0; font: 0.78rem/1.3 var(--mono); color: var(--muted); }
  #anslutning::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--muted); vertical-align: 1px; }
  #anslutning[data-ok]::before { background: var(--accent); }
  button {
    font: inherit; color: inherit; background: none; border: 1px solid var(--linje); border-radius: 8px;
    padding: 7px 12px; font-size: 0.82rem; font-weight: 600; color: var(--muted);
  }
  button:active { background: rgba(255, 255, 255, 0.08); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-yta); }
  #bak { flex: none; }
  .lage { display: flex; align-items: center; gap: 18px; min-height: 2.6rem; }
  .raknare { margin: 0; font: 1rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #bild { font-size: 2.2rem; font-weight: 650; color: var(--text); }
  .prickar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font: 0.85rem var(--mono); color: var(--muted); }
  .prickar i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
  .prickar i.pa { background: var(--accent); }
  .verktyg { display: flex; flex-wrap: wrap; gap: 8px; }
  .besked { margin: 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--accent); color: var(--text); font-size: 0.95rem; }
  #starta { align-self: flex-start; border-color: var(--accent); color: var(--accent); padding: 10px 16px; font-size: 0.95rem; }
  #manus {
    flex: 0 1 auto; min-height: 0; overflow-y: auto; margin: 0; white-space: pre-wrap;
    color: var(--muted); font-size: var(--manus, 1.05rem); line-height: 1.5;
    -webkit-user-select: text; user-select: text; overscroll-behavior: contain;
  }
  #manus:empty { display: none; }
  #fram {
    flex: 1 0 34vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--accent); border-radius: 18px; background: var(--accent-yta); color: var(--accent);
    font-size: 1.6rem; font-weight: 650;
  }
  #fram:active { background: var(--accent-tryck); }
  #fram span { font-size: 4.5rem; line-height: 1; font-weight: 400; }
  /* Menyn med avsnitten och bilderna: hela skärmen, en lista i taget. */
  .meny {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--bg);
    padding: max(14px, env(safe-area-inset-top)) 16px 0;
  }
  .menyhuvud { display: flex; align-items: center; gap: 10px; }
  #menyrubrik { flex: 1; min-width: 0; margin: 0; font-size: 1.15rem; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
  .menytext { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
  .menytext:empty { display: none; }
  #borjahar { align-self: flex-start; margin-top: 10px; border-color: var(--accent); color: var(--accent); }
  .menylista {
    flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 10px -16px 0;
    padding: 0 16px max(16px, env(safe-area-inset-bottom)); overscroll-behavior: contain;
  }
  .menylista button {
    width: 100%; display: flex; align-items: baseline; gap: 12px; padding: 14px 2px;
    border: 0; border-bottom: 1px solid var(--linje); border-radius: 0;
    color: var(--text); font-size: 1rem; font-weight: 500; text-align: left;
  }
  .menylista .nr { min-width: 2.3em; font: 0.85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .menylista .namn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .menylista .meta { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .menylista .har { font: 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .menylista button[data-har] .namn { color: var(--accent); }
  .menylista button[data-dold] .namn { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="namn">
      <p id="titel">Klickern</p>
      <p id="anslutning" aria-live="polite">ansluter …</p>
    </div>
    <button id="bak" type="button">← Bakåt</button>
  </header>

  <div id="lage" class="lage" hidden>
    <p class="raknare"><span id="bild">–</span><span id="antal"></span></p>
    <span id="prickar" class="prickar"></span>
  </div>

  <div class="verktyg">
    <button id="helskarm" type="button" hidden>Helskärm</button>
    <button id="horlurar" type="button" aria-pressed="false" hidden>Styr med hörlurarna</button>
    <button id="avsnitt" type="button" hidden>Avsnitt</button>
    <button id="svart" type="button" aria-pressed="false">Svart skärm</button>
    <button id="storlek" type="button" aria-label="Textstorlek">Aa</button>
    <button id="gom" type="button" aria-pressed="false">Göm bakåt</button>
  </div>

  <p id="besked" class="besked" hidden></p>
  <button id="starta" type="button" hidden>Starta bildspelet</button>
  <p id="manus"></p>

  <button id="fram" type="button"><span aria-hidden="true">↑</span>Nästa</button>
</main>

<div id="meny" class="meny" role="dialog" aria-modal="true" aria-labelledby="menyrubrik" hidden>
  <div class="menyhuvud">
    <button id="menytillbaka" type="button" hidden>← Avsnitt</button>
    <p id="menyrubrik">Avsnitt</p>
    <button id="menystang" type="button">Stäng</button>
  </div>
  <p id="menytext" class="menytext"></p>
  <button id="borjahar" type="button" hidden>Börja här</button>
  <ol id="menylista" class="menylista"></ol>
</div>

<script>
  const BAS = "%BAS%";
  const DATOR = "%DATOR%";
  const $ = (id) => document.getElementById(id);
  let lage = null;
  let ansluten = false;

  // ── Inställningar, sparade i telefonens webbläsare ──
  const minne = {};
  const las = (k) => { try { return localStorage.getItem(k) ?? minne[k] ?? null; } catch { return minne[k] ?? null; } };
  const spara = (k, v) => { minne[k] = v; try { localStorage.setItem(k, v); } catch {} };
  const STORLEKAR = ["1.05rem", "1.35rem", "1.7rem"];
  let storlek = Number(las("klickern-storlek") ?? 0) % STORLEKAR.length;
  let gomd = las("klickern-bakat-gomd") === "1";

  function visaInstallningar() {
    document.documentElement.style.setProperty("--manus", STORLEKAR[storlek]);
    $("bak").hidden = gomd;
    $("gom").setAttribute("aria-pressed", String(gomd));
    $("gom").textContent = gomd ? "Visa bakåt" : "Göm bakåt";
  }

  // ── Steg till datorn ──
  async function steg(s) {
    try {
      const svar = await fetch(`${BAS}/steg`, { method: "POST", body: s, headers: { "content-type": "text/plain", "x-klickern": "1" }, keepalive: true });
      if (svar.ok) visa(await svar.json());
    } catch {
      visaAnslutning(false);
    }
  }

  const fram = () => {
    try { navigator.vibrate?.(12); } catch {}
    steg("fram");
  };
  const bak = () => steg("bak");

  // ── Läget ──
  function besked(text) {
    $("besked").hidden = !text;
    $("besked").textContent = text ?? "";
  }

  function visa(l) {
    lage = l;
    const bildspel = l.lage === "bildspel";
    $("titel").textContent = l.titel || "Klickern";
    document.title = l.titel ? `${l.titel} · Klickern` : "Klickern";
    $("lage").hidden = !bildspel;
    $("bild").textContent = bildspel ? (l.slut ? "Slut" : String(l.bild)) : "–";
    $("antal").textContent = bildspel && !l.slut ? ` / ${l.antal}` : "";
    const k = l.klick ?? 0;
    const n = bildspel && !l.slut ? l.klickAntal ?? 0 : 0;
    const prickar = $("prickar");
    prickar.setAttribute("aria-label", n ? `Klick ${k} av ${n}` : "");
    prickar.innerHTML = !n ? "" : n > 10 ? `klick ${k} av ${n}` : Array.from({ length: n }, (_, i) => `<i class="${i < k ? "pa" : ""}"></i>`).join("");
    $("manus").textContent = bildspel ? l.anteckningar ?? "" : "";
    $("svart").hidden = !bildspel;
    $("svart").setAttribute("aria-pressed", String(l.status === 3 || l.status === 4));
    $("starta").hidden = l.lage !== "redigering";
    $("avsnitt").hidden = l.lage !== "bildspel" && l.lage !== "redigering";
    if (l.lage === "bildspel") besked(l.slut ? "Slut på bildspelet. Nästa avslutar visningen." : l.status === 3 || l.status === 4 ? "Skärmen är svart. Tryck på Svart skärm igen för att visa bilden." : null);
    else if (l.lage === "redigering") besked(`${l.titel} är öppen men visas inte. Tills bildspelet går skickar Nästa och Bakåt piltangenter till fönstret som ligger överst.`);
    else if (l.lage === "ingen") besked("PowerPoint visar inget bildspel. Nästa och Bakåt skickar piltangenter till fönstret som ligger överst på datorn, till exempel en PDF eller en presentation i webbläsaren.");
    else if (l.lage === "upptagen") besked("PowerPoint svarar inte just nu. Håller den på att stängas, eller är en dialogruta öppen på datorn?");
    else besked(`Klickern når inte PowerPoint: ${l.fel ?? "okänt fel"}`);
    uppdateraMetadata();
  }

  function visaAnslutning(ok) {
    ansluten = ok;
    const el = $("anslutning");
    el.toggleAttribute("data-ok", ok);
    el.textContent = ok ? `ansluten · ${DATOR}` : "tappade kontakten, försöker igen …";
  }

  function anslut() {
    const strom = new EventSource(`${BAS}/lage`);
    strom.onopen = () => visaAnslutning(true);
    strom.onmessage = (e) => { visaAnslutning(true); visa(JSON.parse(e.data)); };
    strom.onerror = () => visaAnslutning(false);
  }

  // ── Avsnitten: hoppa i presentationen utan att publiken ser någon meny ──
  // PowerPoints egna avsnitt, och sedan avsnittets bilder med rubrik. Utan avsnitt visas alla bilder.
  let innehall = null;
  const delar = () => (innehall?.avsnitt ?? []).filter((a) => a.antal > 0);
  const harBild = () => (lage?.lage === "bildspel" && !lage.slut ? lage.bild : null);

  function rad(delarna, handling, attribut = {}) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    for (const [k, v] of Object.entries(attribut)) if (v) b.setAttribute(k, "");
    for (const [klass, text] of delarna) {
      if (!text) continue;
      const s = document.createElement("span");
      s.className = klass;
      s.textContent = text;
      b.append(s);
    }
    b.addEventListener("click", handling);
    li.append(b);
    return li;
  }

  async function oppnaMeny() {
    $("meny").hidden = false;
    $("menyrubrik").textContent = "Avsnitt";
    $("menytillbaka").hidden = true;
    $("borjahar").hidden = true;
    $("menylista").replaceChildren();
    $("menytext").textContent = "Läser presentationen …";
    innehall = null;
    try {
      const svar = await fetch(`${BAS}/steg`, { method: "POST", body: "bilder", headers: { "content-type": "text/plain", "x-klickern": "1" } });
      const j = await svar.json();
      if (svar.ok) { visa(j); innehall = j.innehall ?? null; }
    } catch {}
    if ($("meny").hidden) return;
    if (!innehall) { $("menytext").textContent = "Klickern kunde inte läsa presentationen."; return; }
    if (delar().length > 1) visaAvsnitt();
    else visaBilder(null);
  }

  function stangMeny() {
    $("meny").hidden = true;
  }

  function visaAvsnitt() {
    const nu = harBild();
    $("menyrubrik").textContent = "Avsnitt";
    $("menytillbaka").hidden = true;
    $("borjahar").hidden = true;
    $("menytext").textContent = lage?.lage === "bildspel" ? "" : "Bildspelet startar på bilden du väljer.";
    const lista = $("menylista");
    lista.replaceChildren(...delar().map((a, i) => {
      const sist = a.forsta + a.antal - 1;
      const har = nu !== null && nu >= a.forsta && nu <= sist;
      return rad([["nr", String(i + 1).padStart(2, "0")], ["namn", a.namn], ["meta", a.antal === 1 ? `bild ${a.forsta}` : `bild ${a.forsta}–${sist}`], ["har", har ? "här" : ""]], () => visaBilder(a), { "data-har": har });
    }));
    lista.querySelector("[data-har]")?.scrollIntoView({ block: "center" });
  }

  function visaBilder(a) {
    const nu = harBild();
    const bilder = (innehall?.bilder ?? []).filter((b) => !a || (b.nr >= a.forsta && b.nr < a.forsta + a.antal));
    $("menyrubrik").textContent = a ? a.namn : "Alla bilder";
    $("menytillbaka").hidden = !a;
    $("borjahar").hidden = !a;
    $("borjahar").onclick = a ? () => hoppa(a.forsta) : null;
    $("menytext").textContent = lage?.lage === "bildspel" ? "" : "Bildspelet startar på bilden du väljer.";
    const lista = $("menylista");
    lista.replaceChildren(...bilder.map((b) => rad(
      [["nr", String(b.nr)], ["namn", b.rubrik || "Utan rubrik"], ["meta", b.dold ? "dold" : ""], ["har", b.nr === nu ? "här" : ""]],
      () => hoppa(b.nr),
      { "data-har": b.nr === nu, "data-dold": b.dold },
    )));
    (lista.querySelector("[data-har]") ?? lista.firstElementChild)?.scrollIntoView({ block: "center" });
  }

  function hoppa(nr) {
    stangMeny();
    steg(`ga ${nr}`);
  }

  // ── Hörlurarna: Media Session medan en tyst slinga spelar ──
  // Chrome visar mediekontroller först för ljud över fem sekunder, så slingan är tio sekunder.
  function tystLjud() {
    const takt = 8000, antal = takt * 10;
    const buf = new ArrayBuffer(44 + antal), v = new DataView(buf);
    const text = (pos, s) => [...s].forEach((c, i) => v.setUint8(pos + i, c.charCodeAt(0)));
    text(0, "RIFF"); v.setUint32(4, 36 + antal, true); text(8, "WAVE"); text(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, takt, true); v.setUint32(28, takt, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    text(36, "data"); v.setUint32(40, antal, true);
    new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  const ATGARDER = ["play", "pause", "nexttrack", "previoustrack", "seekforward", "seekbackward"];
  let ljud = null;
  let horlurarPa = false;

  async function slaPaHorlurar() {
    if (!ljud) { ljud = new Audio(tystLjud()); ljud.loop = true; }
    try { await ljud.play(); } catch { return; }
    const ms = navigator.mediaSession;
    // Med en egen hanterare för pausa pausar inte webbläsaren själv, men slingan hålls igång ändå.
    const igang = () => { if (ljud.paused) ljud.play().catch(() => {}); ms.playbackState = "playing"; };
    const f = () => { steg("fram"); igang(); };
    const b = () => { steg("bak"); igang(); };
    const hanterare = { play: f, pause: f, nexttrack: f, seekforward: f, previoustrack: b, seekbackward: b };
    for (const a of ATGARDER) { try { ms.setActionHandler(a, hanterare[a]); } catch {} }
    ms.playbackState = "playing";
    horlurarPa = true;
    visaHorlurar();
    uppdateraMetadata();
  }

  function stangHorlurar() {
    ljud?.pause();
    const ms = navigator.mediaSession;
    for (const a of ATGARDER) { try { ms.setActionHandler(a, null); } catch {} }
    ms.metadata = null;
    ms.playbackState = "none";
    horlurarPa = false;
    visaHorlurar();
  }

  function visaHorlurar() {
    $("horlurar").setAttribute("aria-pressed", String(horlurarPa));
    $("horlurar").textContent = horlurarPa ? "Hörlurarna styr" : "Styr med hörlurarna";
  }

  // Låsskärmen visar var i presentationen man står.
  function uppdateraMetadata() {
    if (!horlurarPa || typeof MediaMetadata === "undefined" || !lage) return;
    const l = lage;
    let rad = "Klickern";
    if (l.lage === "bildspel") rad = l.slut ? "Slut på bildspelet" : `Bild ${l.bild} av ${l.antal}${l.klickAntal ? ` · klick ${l.klick} av ${l.klickAntal}` : ""}`;
    else if (l.lage === "redigering" || l.lage === "ingen") rad = "Piltangenter till fönstret överst";
    navigator.mediaSession.metadata = new MediaMetadata({ title: rad, artist: l.titel || DATOR, album: "Klickern" });
  }

  // ── Skärmen vaken och helskärm ──
  let vakenLas = null;
  async function hallVaken() {
    if (document.visibilityState !== "visible" || vakenLas || !("wakeLock" in navigator)) return;
    try {
      vakenLas = await navigator.wakeLock.request("screen");
      vakenLas.addEventListener("release", () => { vakenLas = null; });
    } catch {}
  }

  // Wake Lock kräver https, så på wifi finns det inte. Där försöker sidan hålla skärmen tänd med en tyst
  // film på två sekunder i en slinga: en film som spelas får skärmen att stå på. Skärmen slocknar annars.

  let vakenFilm = null;
  function hallVakenMedFilm() {
    if ("wakeLock" in navigator || document.visibilityState !== "visible") return;
    if (!vakenFilm) {
      vakenFilm = Object.assign(document.createElement("video"), { src: VAKEN_FILM, muted: true, loop: true, playsInline: true });
      vakenFilm.setAttribute("playsinline", "");
      vakenFilm.setAttribute("aria-hidden", "true");
      vakenFilm.style.cssText = "position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none";
      document.body.append(vakenFilm);
    }
    vakenFilm.play().catch(() => {});
  }

  function visaHelskarm() {
    $("helskarm").textContent = document.fullscreenElement ? "Lämna helskärm" : "Helskärm";
  }

  // ── Knappar och tangenter ──
  $("fram").addEventListener("click", fram);
  $("bak").addEventListener("click", bak);
  $("starta").addEventListener("click", () => steg("start"));
  $("svart").addEventListener("click", () => steg("svart"));
  $("avsnitt").addEventListener("click", oppnaMeny);
  $("menystang").addEventListener("click", stangMeny);
  $("menytillbaka").addEventListener("click", visaAvsnitt);
  $("storlek").addEventListener("click", () => { storlek = (storlek + 1) % STORLEKAR.length; spara("klickern-storlek", String(storlek)); visaInstallningar(); });
  $("gom").addEventListener("click", () => { gomd = !gomd; spara("klickern-bakat-gomd", gomd ? "1" : "0"); visaInstallningar(); });
  $("horlurar").addEventListener("click", () => (horlurarPa ? stangHorlurar() : slaPaHorlurar()));
  $("helskarm").addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  });
  document.addEventListener("fullscreenchange", visaHelskarm);
  // En clicker eller ett tangentbord kopplat till telefonen.
  document.addEventListener("keydown", (e) => {
    if (!$("meny").hidden) { if (e.key === "Escape") stangMeny(); return; }
    if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); fram(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); bak(); }
  });
  document.addEventListener("visibilitychange", hallVaken);
  document.addEventListener("visibilitychange", hallVakenMedFilm);
  // Webbläsaren kan kräva ett tryck innan filmen får spelas.
  document.addEventListener("pointerdown", hallVakenMedFilm);

  $("helskarm").hidden = !document.fullscreenEnabled;
  $("horlurar").hidden = !("mediaSession" in navigator);
  visaInstallningar();
  hallVaken();
  hallVakenMedFilm();
  anslut();
